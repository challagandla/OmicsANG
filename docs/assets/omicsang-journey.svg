<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">The OmicsANG beginner journey</title>
  <desc id="description">Six connected steps lead from installation and the synthetic demo through Study Guard, a dry-run, a deliberate real run, and result inspection.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1218"/>
      <stop offset="0.55" stop-color="#101b22"/>
      <stop offset="1" stop-color="#0d161c"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.52" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2b34"/>
      <stop offset="1" stop-color="#131d24"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1l7 4-7 4z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1200" height="440" rx="28" fill="url(#background)"/>
  <circle cx="1090" cy="24" r="190" fill="#2dd4bf" opacity="0.035"/>
  <circle cx="110" cy="440" r="210" fill="#a78bfa" opacity="0.04"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(54 48)">
      <rect width="48" height="48" rx="14" fill="#102b2c" stroke="#2dd4bf" stroke-width="1.5"/>
      <path d="M14 30c6-15 14-15 20 0M16 18h16M24 12v24" fill="none" stroke="#5eead4" stroke-width="2.2" stroke-linecap="round"/>
      <text x="66" y="20" fill="#f5fbff" font-size="26" font-weight="720">Your first OmicsANG run</text>
      <text x="66" y="46" fill="#93a7b4" font-size="15">A safe path from an empty workspace to a verified synthetic result</text>
    </g>

    <path d="M112 246H1082" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" opacity="0.65" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <g transform="translate(54 160)">
        <rect width="164" height="174" rx="18" fill="url(#card)" stroke="#2b414b"/>
        <circle cx="28" cy="28" r="15" fill="#123c3a" stroke="#2dd4bf"/>
        <text x="28" y="33" text-anchor="middle" fill="#7ff7e6" font-size="14" font-weight="700">1</text>
        <path d="M61 22h64M61 30h44" stroke="#405661" stroke-width="4" stroke-linecap="round"/>
        <text x="18" y="80" fill="#f4fbff" font-size="18" font-weight="700">Install</text>
        <text x="18" y="107" fill="#9eb0ba" font-size="13">Create one clean</text>
        <text x="18" y="126" fill="#9eb0ba" font-size="13">Python environment.</text>
        <rect x="18" y="145" width="108" height="10" rx="5" fill="#1c3538"/>
        <rect x="18" y="145" width="34" height="10" rx="5" fill="#2dd4bf"/>
      </g>

      <g transform="translate(238 160)">
        <rect width="164" height="174" rx="18" fill="url(#card)" stroke="#2b414b"/>
        <circle cx="28" cy="28" r="15" fill="#12373f" stroke="#22d3ee"/>
        <text x="28" y="33" text-anchor="middle" fill="#67e8f9" font-size="14" font-weight="700">2</text>
        <path d="M62 17h48l14 14v27H62z" fill="none" stroke="#67e8f9" stroke-width="2" stroke-linejoin="round"/>
        <path d="M110 17v14h14" fill="none" stroke="#67e8f9" stroke-width="2"/>
        <text x="18" y="80" fill="#f4fbff" font-size="18" font-weight="700">Stage demo</text>
        <text x="18" y="107" fill="#9eb0ba" font-size="13">Copy four synthetic</text>
        <text x="18" y="126" fill="#9eb0ba" font-size="13">samples—no real data.</text>
        <rect x="18" y="145" width="108" height="10" rx="5" fill="#18343d"/>
        <rect x="18" y="145" width="51" height="10" rx="5" fill="#22d3ee"/>
      </g>

      <g transform="translate(422 160)">
        <rect width="164" height="174" rx="18" fill="url(#card)" stroke="#2b414b"/>
        <circle cx="28" cy="28" r="15" fill="#12333f" stroke="#38bdf8"/>
        <text x="28" y="33" text-anchor="middle" fill="#7dd3fc" font-size="14" font-weight="700">3</text>
        <path d="M82 15l23 9v15c0 13-9 21-23 26-14-5-23-13-23-26V24z" fill="#102d3b" stroke="#38bdf8" stroke-width="2"/>
        <path d="M71 39l8 8 15-18" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="18" y="80" fill="#f4fbff" font-size="18" font-weight="700">Study Guard</text>
        <text x="18" y="107" fill="#9eb0ba" font-size="13">Review conditions,</text>
        <text x="18" y="126" fill="#9eb0ba" font-size="13">batches, and replicates.</text>
        <rect x="18" y="145" width="108" height="10" rx="5" fill="#19323e"/>
        <rect x="18" y="145" width="68" height="10" rx="5" fill="#38bdf8"/>
      </g>

      <g transform="translate(606 160)">
        <rect width="164" height="174" rx="18" fill="url(#card)" stroke="#2b414b"/>
        <circle cx="28" cy="28" r="15" fill="#172f45" stroke="#60a5fa"/>
        <text x="28" y="33" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="700">4</text>
        <rect x="59" y="18" width="66" height="43" rx="7" fill="#0c151b" stroke="#60a5fa"/>
        <path d="M70 31l8 7-8 7M84 47h24" fill="none" stroke="#93c5fd" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="18" y="80" fill="#f4fbff" font-size="18" font-weight="700">Dry-run</text>
        <text x="18" y="107" fill="#9eb0ba" font-size="13">Preview the exact plan</text>
        <text x="18" y="126" fill="#9eb0ba" font-size="13">without writing results.</text>
        <rect x="18" y="145" width="108" height="10" rx="5" fill="#1b3043"/>
        <rect x="18" y="145" width="85" height="10" rx="5" fill="#60a5fa"/>
      </g>

      <g transform="translate(790 160)">
        <rect width="164" height="174" rx="18" fill="url(#card)" stroke="#2b414b"/>
        <circle cx="28" cy="28" r="15" fill="#252c48" stroke="#818cf8"/>
        <text x="28" y="33" text-anchor="middle" fill="#a5b4fc" font-size="14" font-weight="700">5</text>
        <circle cx="91" cy="39" r="24" fill="#1f2440" stroke="#818cf8" stroke-width="2"/>
        <path d="M85 27l17 12-17 12z" fill="#a5b4fc"/>
        <text x="18" y="80" fill="#f4fbff" font-size="18" font-weight="700">Real run</text>
        <text x="18" y="107" fill="#9eb0ba" font-size="13">Confirm deliberately</text>
        <text x="18" y="126" fill="#9eb0ba" font-size="13">after the preview passes.</text>
        <rect x="18" y="145" width="108" height="10" rx="5" fill="#292d49"/>
        <rect x="18" y="145" width="99" height="10" rx="5" fill="#818cf8"/>
      </g>

      <g transform="translate(974 160)">
        <rect width="164" height="174" rx="18" fill="url(#card)" stroke="#4b4164"/>
        <circle cx="28" cy="28" r="15" fill="#33284c" stroke="#a78bfa"/>
        <text x="28" y="33" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="700">6</text>
        <path d="M62 57V27M82 57V39M102 57V20M122 57V32" stroke="#c4b5fd" stroke-width="7" stroke-linecap="round"/>
        <text x="18" y="80" fill="#f4fbff" font-size="18" font-weight="700">Inspect results</text>
        <text x="18" y="107" fill="#9eb0ba" font-size="13">Open the summary and</text>
        <text x="18" y="126" fill="#9eb0ba" font-size="13">confirm its provenance.</text>
        <rect x="18" y="145" width="108" height="10" rx="5" fill="#322b48"/>
        <rect x="18" y="145" width="108" height="10" rx="5" fill="#a78bfa"/>
      </g>
    </g>

    <g transform="translate(54 384)">
      <rect width="1092" height="1" fill="#263842"/>
      <circle cx="6" cy="28" r="4" fill="#2dd4bf"/>
      <text x="20" y="33" fill="#8095a2" font-size="13">Local machine</text>
      <circle cx="145" cy="28" r="4" fill="#38bdf8"/>
      <text x="159" y="33" fill="#8095a2" font-size="13">Loopback only</text>
      <circle cx="284" cy="28" r="4" fill="#a78bfa"/>
      <text x="298" y="33" fill="#8095a2" font-size="13">Your pipeline files</text>
      <text x="1092" y="33" text-anchor="end" fill="#657985" font-size="12">Begin safely. Review every real run.</text>
    </g>
  </g>
</svg>
