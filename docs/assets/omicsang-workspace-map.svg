<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title description">
  <title id="title">Map of the OmicsANG workspace</title>
  <desc id="description">A labelled illustration of the pipeline sidebar, workspace tabs, Study Guard, RunPlan, persistent run monitor, and hidden-panel restore dock.</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172129"/>
      <stop offset="1" stop-color="#0d1419"/>
    </linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#164e4a"/>
      <stop offset="1" stop-color="#173347"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="150%">
      <feDropShadow dx="0" dy="15" stdDeviation="16" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <marker id="callout" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0l9 4.5L0 9z" fill="#5eead4"/>
    </marker>
  </defs>

  <rect width="1200" height="650" rx="30" fill="#081015"/>
  <circle cx="1110" cy="54" r="180" fill="#38bdf8" opacity="0.035"/>
  <circle cx="50" cy="600" r="170" fill="#a78bfa" opacity="0.035"/>

  <g filter="url(#shadow)" transform="translate(80 92)">
    <rect width="1040" height="490" rx="18" fill="url(#shell)" stroke="#354752" stroke-width="1.5"/>

    <rect width="1040" height="54" rx="18" fill="#18232a"/>
    <path d="M0 54h1040" stroke="#354752"/>
    <circle cx="25" cy="27" r="6" fill="#fb7185"/>
    <circle cx="45" cy="27" r="6" fill="#fbbf24"/>
    <circle cx="65" cy="27" r="6" fill="#34d399"/>
    <rect x="91" y="14" width="31" height="27" rx="8" fill="#123536" stroke="#2dd4bf"/>
    <path d="M99 31c4-10 10-10 15 0M106.5 21v14" fill="none" stroke="#5eead4" stroke-width="1.6" stroke-linecap="round"/>
    <text x="134" y="33" fill="#eef8fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">OmicsANG</text>
    <rect x="844" y="13" width="82" height="29" rx="8" fill="#121a20" stroke="#354752"/>
    <text x="885" y="32" text-anchor="middle" fill="#9fb0ba" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">View</text>
    <rect x="936" y="13" width="82" height="29" rx="8" fill="#121a20" stroke="#354752"/>
    <text x="977" y="32" text-anchor="middle" fill="#9fb0ba" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">Help</text>

    <rect y="54" width="214" height="436" fill="#111a20"/>
    <path d="M214 54v436" stroke="#354752"/>
    <text x="18" y="86" fill="#748b98" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">PIPELINES</text>
    <rect x="14" y="101" width="184" height="34" rx="8" fill="#0c1419" stroke="#2b3b44"/>
    <circle cx="30" cy="118" r="5" fill="#34d399"/>
    <text x="43" y="122" fill="#ebf7fa" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">demo-pipeline</text>
    <rect x="14" y="146" width="184" height="30" rx="7" fill="#151f25"/>
    <circle cx="30" cy="161" r="4" fill="#647885"/>
    <text x="43" y="165" fill="#91a4af" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">your-next-pipeline</text>
    <rect x="14" y="397" width="184" height="71" rx="10" fill="#10252a" stroke="#24555a"/>
    <text x="27" y="420" fill="#5eead4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">Local workspace</text>
    <text x="27" y="440" fill="#88a1ac" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">One trusted user</text>
    <text x="27" y="457" fill="#88a1ac" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">Loopback only</text>

    <rect x="214" y="54" width="568" height="64" fill="#111a20"/>
    <path d="M214 118h568" stroke="#354752"/>
    <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">
      <rect x="230" y="70" width="70" height="32" rx="8" fill="#18242b"/>
      <text x="265" y="90" text-anchor="middle" fill="#8fa3ae">Monitor</text>
      <rect x="309" y="70" width="64" height="32" rx="8" fill="#18242b"/>
      <text x="341" y="90" text-anchor="middle" fill="#8fa3ae">Browse</text>
      <rect x="382" y="70" width="60" height="32" rx="8" fill="#18242b"/>
      <text x="412" y="90" text-anchor="middle" fill="#8fa3ae">Study</text>
      <rect x="451" y="70" width="50" height="32" rx="8" fill="url(#active)" stroke="#2dd4bf"/>
      <text x="476" y="90" text-anchor="middle" fill="#d6fffa" font-weight="700">Run</text>
      <rect x="510" y="70" width="64" height="32" rx="8" fill="#18242b"/>
      <text x="542" y="90" text-anchor="middle" fill="#8fa3ae">Results</text>
      <rect x="583" y="70" width="54" height="32" rx="8" fill="#18242b"/>
      <text x="610" y="90" text-anchor="middle" fill="#8fa3ae">Code</text>
      <rect x="646" y="70" width="60" height="32" rx="8" fill="#18242b"/>
      <text x="676" y="90" text-anchor="middle" fill="#8fa3ae">Agents</text>
      <rect x="715" y="70" width="51" height="32" rx="8" fill="#18242b"/>
      <text x="740.5" y="90" text-anchor="middle" fill="#8fa3ae">More</text>
    </g>

    <rect x="230" y="136" width="536" height="336" rx="13" fill="#0e171c" stroke="#293b44"/>
    <text x="252" y="168" fill="#f1f9fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Run · demo-pipeline</text>
    <text x="252" y="188" fill="#718895" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">Preview first. Launch deliberately.</text>

    <rect x="250" y="208" width="236" height="105" rx="11" fill="#142128" stroke="#2b414b"/>
    <circle cx="272" cy="231" r="10" fill="#123d39" stroke="#2dd4bf"/>
    <path d="M267 231l4 4 7-9" fill="none" stroke="#7ff7e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="291" y="235" fill="#e9f7f9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">Study Guard</text>
    <text x="267" y="260" fill="#92a8b2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">4 synthetic rows · configured</text>
    <rect x="267" y="277" width="128" height="20" rx="10" fill="#3a3217"/>
    <text x="331" y="291" text-anchor="middle" fill="#fde68a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700">REVIEW · 1 WARNING</text>

    <rect x="500" y="208" width="246" height="105" rx="11" fill="#142128" stroke="#2b414b"/>
    <text x="518" y="235" fill="#e9f7f9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">RunPlan</text>
    <rect x="518" y="250" width="209" height="43" rx="7" fill="#091116"/>
    <text x="530" y="269" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9">snakemake -s Snakefile --cores 1</text>
    <text x="530" y="284" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="8.5">-n -p --configfile config/config.yaml</text>

    <rect x="250" y="329" width="496" height="82" rx="11" fill="#111d23" stroke="#2b414b"/>
    <text x="268" y="355" fill="#839aa5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">Config</text>
    <rect x="268" y="366" width="268" height="27" rx="7" fill="#0a1318" stroke="#31434c"/>
    <text x="280" y="384" fill="#b8c8cf" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10">config/config.yaml</text>
    <rect x="551" y="365" width="82" height="29" rx="8" fill="#163a3a" stroke="#2dd4bf"/>
    <text x="592" y="384" text-anchor="middle" fill="#c9fff7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">Dry-run</text>
    <rect x="643" y="365" width="84" height="29" rx="8" fill="#3b222a" stroke="#fb7185"/>
    <text x="685" y="384" text-anchor="middle" fill="#fecdd3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">Real run</text>

    <rect x="250" y="426" width="496" height="28" rx="7" fill="#0a1217"/>
    <circle cx="268" cy="440" r="4" fill="#34d399"/>
    <text x="280" y="444" fill="#879ca7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10">Ready · exact command and resources resolved</text>

    <rect x="782" y="54" width="258" height="436" fill="#10191f"/>
    <path d="M782 54v436" stroke="#354752"/>
    <text x="801" y="84" fill="#eef8fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">Run Monitor</text>
    <text x="801" y="103" fill="#718894" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10">Persistent across tabs</text>
    <rect x="799" y="122" width="224" height="70" rx="10" fill="#142128" stroke="#2b414b"/>
    <circle cx="818" cy="144" r="5" fill="#38bdf8"/>
    <text x="831" y="148" fill="#d9e7eb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">demo dry-run</text>
    <text x="817" y="170" fill="#7e949f" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9">running · 1 core</text>
    <rect x="799" y="205" width="224" height="117" rx="10" fill="#0a1217" stroke="#263841"/>
    <text x="815" y="229" fill="#e4f0f3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">Live output is in Terminal</text>
    <text x="815" y="249" fill="#8da2ac" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10">Attach to the tracked session</text>
    <text x="815" y="265" fill="#8da2ac" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10">without changing its process.</text>
    <rect x="815" y="283" width="112" height="20" rx="6" fill="#18303a"/>
    <text x="871" y="297" text-anchor="middle" fill="#7dd3fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="9">Open terminal</text>
    <rect x="799" y="338" width="224" height="91" rx="10" fill="#142128" stroke="#2b414b"/>
    <text x="815" y="363" fill="#e4f0f3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">Next safe action</text>
    <text x="815" y="383" fill="#8da2ac" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10">Inspect the preview, then</text>
    <text x="815" y="399" fill="#8da2ac" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10">choose a deliberate real run.</text>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="438" y="563" width="326" height="54" rx="15" fill="#17242b" stroke="#49606b" filter="url(#shadow)"/>
    <circle cx="466" cy="590" r="13" fill="#123b38" stroke="#2dd4bf"/>
    <rect x="459" y="584" width="14" height="12" rx="2" fill="none" stroke="#5eead4"/>
    <path d="M459 584h4v12h-4z" fill="#5eead4"/>
    <text x="488" y="587" fill="#718894" font-size="10" font-weight="700" letter-spacing="1">HIDDEN PANELS</text>
    <text x="488" y="603" fill="#eef8fb" font-size="12" font-weight="650">Pipelines</text>
    <rect x="591" y="577" width="153" height="28" rx="8" fill="#14302f" stroke="#2f766d"/>
    <text x="667.5" y="596" text-anchor="middle" fill="#cffff7" font-size="11" font-weight="650">Restore without leaving Run</text>

    <path d="M109 57C109 82 142 90 171 111" fill="none" stroke="#5eead4" stroke-width="1.5" marker-end="url(#callout)"/>
    <text x="75" y="38" fill="#5eead4" font-size="12" font-weight="700">1 · Pick a pipeline</text>

    <path d="M511 56v45" fill="none" stroke="#5eead4" stroke-width="1.5" marker-end="url(#callout)"/>
    <text x="443" y="38" fill="#5eead4" font-size="12" font-weight="700">2 · Move through the tabs</text>

    <path d="M1030 56c0 17-35 24-52 36" fill="none" stroke="#5eead4" stroke-width="1.5" marker-end="url(#callout)"/>
    <text x="937" y="38" fill="#5eead4" font-size="12" font-weight="700">3 · Watch every run</text>

    <text x="80" y="624" fill="#6f8591" font-size="11">Panels resize, collapse, and restore while your current tab and terminal session stay in place.</text>
  </g>
</svg>
